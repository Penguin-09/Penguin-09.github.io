<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hollow's Hoard</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link
            rel="shortcut icon"
            href="images/favicon.png"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="js/detail.js" defer></script>
    </head>
    <body>
        <!-- HEADER -->
        <div
            class="d-flex justify-content-between p-3 position-absolute t-0"
            style="background-color: var(--colorGreyDark); width: 100%"
        >
            <div class="d-flex flex-column flex-md-row gap-4">
                <!-- Title -->
                <a
                    class="customHover d-flex align-items-center"
                    href="index.html"
                >
                    <img
                        class="fs-3 me-2"
                        style="height: 1.3em"
                        src="images/logo.png"
                        alt="logo"
                    />
                    <p class="fs-3 m-0" style="color: var(--colorRed)">
                        Hollow's Hoard
                    </p>
                </a>
                <a
                    class="customHover d-flex align-items-center"
                    href="index.html#storeNavigation"
                >
                    <i
                        class="bi bi-arrow-left fs-3 me-1"
                        style="color: var(--colorWhite)"
                    ></i>
                    <p class="fs-3 m-0" style="color: var(--colorWhite)">
                        Back to Store
                    </p>
                </a>
            </div>

            <div
                class="d-flex flex-column flex-md-row gap-4 justify-content-end"
            >
                <!-- Home -->
                <a class="customHover d-flex" href="index.html#home">
                    <i
                        class="bi bi-house fs-3 me-1"
                        style="color: var(--colorWhite)"
                    ></i>
                    <p class="fs-3 m-0" style="color: var(--colorWhite)">
                        Home
                    </p>
                </a>

                <!-- About -->
                <a class="customHover d-flex" href="index.html#about">
                    <i
                        class="bi bi-person fs-3 me-1"
                        style="color: var(--colorWhite)"
                    ></i>
                    <p class="fs-3 m-0">About</p>
                </a>
            </div>
        </div>

        <div style="height: 70px"></div>

        <!-- MAIN -->
        <div
            class="d-flex p-4"
            style="
                height: calc(100vh - 70px);
                background-image: linear-gradient(
                    to top left,
                    var(--colorRedDark),
                    var(--colorGreyLight)
                );
            "
        >
            <div
                class="col-lg-8 d-flex justify-content-center align-items-center flex-column"
            >
                <!-- Title -->
                <p
                    class="display-3 m-0 text-center"
                    style="color: var(--colorRed)"
                    id="title"
                ></p>

                <!-- Image -->
                <img class="customDetailRing" style="width: 25em" id="image" />

                <!-- Effect -->
                <p
                    class="text-center fs-3 m-0 px-5"
                    style="color: var(--colorWhite)"
                    id="effect"
                ></p>
            </div>

            <div
                class="col-lg-4 p-3"
                style="background-color: var(--colorGreyDark)"
            >
                <!-- Description -->
                <div id="description">
                    <div class="fs-5 mb-4">
                        <i class="bi bi-quote"></i> <span id="line0"></span>
                    </div>

                    <div class="fs-5" id="line1"></div>

                    <div class="fs-5 mt-4">
                        <span id="line2"></span> <i class="bi bi-quote"></i>
                    </div>
                </div>

                <!-- Cart Button -->
                <div class="d-flex justify-content-center">
                    <button
                        class="d-flex customHover"
                        style="
                            color: var(--colorRed);
                            background: none;
                            border: none;
                        "
                    >
                        <i
                            class="bi bi-cart fs-3 me-1"
                            style="color: var(--colorRed)"
                        ></i>
                        <p class="fs-3 m-0">Add to Cart</p>
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
